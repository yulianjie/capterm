    </linearGradient>
    <linearGradient id="dial" x1="67" y1="52" x2="185" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#678F9D"/>
      <stop offset="1" stop-color="#3B6274"/>
    </linearGradient>
    <linearGradient id="head" x1="172" y1="90" x2="125" y2="154" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FFF9"/>
