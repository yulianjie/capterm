<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">CapTerm Command Compass</title>
  <desc id="description">Two opposing code brackets form the needle of a nautical compass.</desc>
  <defs>
    <linearGradient id="tile" x1="31" y1="12" x2="219" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#254455"/>
      <stop offset=".56" stop-color="#142C3D"/>
      <stop offset="1" stop-color="#0B1725"/>
    </linearGradient>
    <linearGradient id="rim" x1="128" y1="8" x2="128" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#668D9F" stop-opacity=".68"/>
