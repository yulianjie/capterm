      <stop offset="1" stop-color="#35A9CF"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <path d="M52 158.7A82 82 0 0 1 171.5 58.5M204 97.3A82 82 0 0 1 84.5 197.5M128 46v14m82 68h-14m-68 82v-14m-82-68h14"
