name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    uses: ./.github/workflows/windows-package.yml

  publish:
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/windows-package.yml
